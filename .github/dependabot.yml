# Dependabot configuration for LANCE
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
    ignore:
      # The `futures` meta-crate triggers an upstream dependabot-core
      # `unknown_error` during rust-minor group filtering
      # (dependency_change_builder.rb:155). `futures` is kept current
      # manually (last bumped to 0.3.32 alongside the opentelemetry 0.32
      # migration); this ignore is NARROWED to only suppress the minor/patch
      # updates that re-trigger the upstream updater crash, so that
      # SECURITY/major advisories on `futures` are still surfaced.
      - dependency-name: "futures"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      # Group minor/patch updates to reduce PR noise
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
