# Dependabot configuration for LANCE
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
    ignore:
      # The `futures` meta-crate triggers an upstream dependabot-core
      # `unknown_error` during rust-minor group filtering
      # (dependency_change_builder.rb:155). Ignoring it unblocks the rest of
      # the weekly group. See PR for details / upstream issue tracking.
      - dependency-name: "futures"
    groups:
      # Group minor/patch updates to reduce PR noise
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
